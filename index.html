<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- xTracky Tracking Script v2 -->
  <script
      src="https://cdn.xtracky.com/scripts/utm-handler.js"
      data-token="e9216e8f-23df-4b2a-819c-be3be33d36ee"
  >
  </script>

  <script>
    // ===== COLOQUE SEU LINK AQUI =====
    var LINK_DESTINO = "https://crspaon.shop/l/8c345198?shk=vp9ru4rl";
    // =================================

    // Delay mínimo só para a Xtracky disparar o evento (em milissegundos)
    var DELAY = 150;

    // Este bloco só roda depois que o script da Xtracky já foi baixado
    // e executado (ele está logo acima e é carregado em sequência).
    (function () {
      var link = LINK_DESTINO;
      try {
        // Repassa UTMs, click id do Kwai, xcod etc. para o link de destino
        var destino = new URL(LINK_DESTINO);
        var params = new URLSearchParams(window.location.search);
        params.forEach(function (valor, chave) {
          if (!destino.searchParams.has(chave)) {
            destino.searchParams.set(chave, valor);
          }
        });
        link = destino.toString();
      } catch (e) {}

      setTimeout(function () {
        window.location.replace(link);
      }, DELAY);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando...</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #0a1f3c 0%, #0d2f5a 50%, #123f7a 100%);
      background-attachment: fixed;
    }
  </style>
</head>

</html>
